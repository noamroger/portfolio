[build]
  command = "npm run build"
  publish = "dist"

# Do NOT set SITE_LOCALE here: netlify.toml takes precedence over the values
# defined in the Netlify UI, which would force the same language on both sites.
# The French site sets SITE_LOCALE=fr in its own environment variables.

# Astro fingerprints everything it emits under /_astro/, so it can be cached
# forever. Netlify's default is `max-age=0, must-revalidate`.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Pages are prefetched on load, but Netlify's default `max-age=0,
# must-revalidate` would still force a conditional request on click, costing a
# full round trip and undoing the prefetch. A short fresh window bridges
# prefetch -> click; stale-while-revalidate keeps later visits instant while
# refreshing in the background.
#
# These are listed one route at a time on purpose: a catch-all would collide
# with the /_astro/* rule above, and Netlify does not document which rule wins
# for a conflicting header. The trailing `*` covers both /about and /about/.
# Add a line here when you add a page.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=86400"

[[headers]]
  for = "/about*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=86400"

[[headers]]
  for = "/projects*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=86400"

[[headers]]
  for = "/contact*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://forms.noam.ovh; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'"
