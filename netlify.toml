[build]
  command = "npm run build"
  publish = "dist"

# Netlify serves /404.html on its own. English pages need their own 404.
[[redirects]]
  from = "/en/*"
  to = "/en/404/"
  status = 404

# Astro fingerprints everything it emits under /_astro/, so it can be cached
# forever. Netlify's default is `max-age=0, must-revalidate`.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Pages are prefetched on load, but Netlify's default `max-age=0,
# must-revalidate` would still force a conditional request on click, costing a
# full round trip and undoing the prefetch. A short fresh window bridges
# prefetch -> click; stale-while-revalidate keeps later visits instant while
# refreshing in the background.
#
# These are listed one route at a time on purpose: a catch-all would collide
# with the /_astro/* rule above, and Netlify does not document which rule wins
# for a conflicting header. The trailing `*` covers both /about and /about/.
# Add a line here when you add a page.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=86400"

[[headers]]
  for = "/en*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=86400"

[[headers]]
  for = "/about*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=86400"

[[headers]]
  for = "/projects*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=86400"

[[headers]]
  for = "/contact*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=86400"

# Umami Cloud: the tracker loads from cloud.umami.is but posts its hits to
# gateway.umami.is/api/send (read from the live script, the docs don't say).
# Both must be allowed or the stats stay at zero with no visible error.
# If Umami is ever self-hosted, swap these two hosts for your own.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://form.noam.ovh https://gateway.umami.is; form-action 'self' https://form.noam.ovh; base-uri 'self'; frame-ancestors 'none'; object-src 'none'"
